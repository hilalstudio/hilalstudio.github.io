<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Get Hilal — daily Hijri-date puzzle</title>
<meta name="description" content="Hilal — a daily Hijri-date puzzle. Get it for your phone." />
<style>
  :root { --bg:#0F1B2D; --card:#16263d; --gold:#E0B973; --text:#F4ECDD; --dim:#9bb0c9; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body {
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center; min-height:100%; padding:24px;
    text-align:center; -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:360px; }
  h1 { font-size:22px; letter-spacing:1px; margin:0 0 6px; color:var(--gold); }
  p { color:var(--dim); margin:0 0 22px; line-height:1.5; font-size:15px; }
  /* Store badges — official-badge layout: logo left, two-line label. Black like
     Apple's real badge; the logo + wordmark is what tells them apart. */
  a.badge {
    display:flex; align-items:center; gap:12px; text-align:left;
    background:#000; color:#fff; text-decoration:none;
    border:1px solid rgba(244,236,221,.35); border-radius:12px;
    padding:10px 16px; margin:10px 0; min-height:58px;
  }
  a.badge svg { width:28px; height:28px; flex:none; fill:#fff; }
  a.badge .lines { display:flex; flex-direction:column; line-height:1.15; }
  a.badge .pre { font-size:11px; letter-spacing:.4px; opacity:.85; }
  a.badge .store { font-size:19px; font-weight:700; letter-spacing:.2px; }
  .soon { color:var(--dim); font-size:13px; margin-top:14px; }
  .moon { font-size:34px; margin-bottom:10px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="moon">☾</div>
    <h1>Hilal</h1>
    <p>A daily Hijri-date puzzle, with a reflection from the Qur’ān and Sunnah.</p>
    <div id="links">
      <!-- Populated by JS per device; static fallback below for no-JS / desktop. -->
      <a class="badge" id="ios" href="https://apps.apple.com/app/id6777826022">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.03 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg>
        <span class="lines"><span class="pre">Download on the</span><span class="store">App Store</span></span>
      </a>
      <a class="badge" id="android" href="https://play.google.com/store/apps/details?id=com.puzzle.hijri.hilal" style="display:none">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22.018 13.298l-3.919 2.218-3.515-3.493 3.543-3.521 3.891 2.202a1.49 1.49 0 0 1 0 2.594zM1.337.924a1.486 1.486 0 0 0-.112.568v21.017c0 .217.045.419.124.6l11.155-11.087L1.337.924zm12.207 10.065l3.258-3.238L3.45.195a1.466 1.466 0 0 0-.946-.179l11.04 10.973zm0 2.067l-11 10.933c.298.036.612-.016.906-.183l13.324-7.54-3.23-3.21z"/></svg>
        <span class="lines"><span class="pre">GET IT ON</span><span class="store">Google Play</span></span>
      </a>
      <div class="soon" id="androidSoon" style="display:none">Coming to Google Play soon — grab it on iPhone for now.</div>
    </div>
  </div>
<script>
  // Single switch: flip to true the moment the Android build is live on Play.
  // No app update needed — the share link just starts routing Android users to Play.
  var ANDROID_LIVE = true;
  var APP_STORE_URL = "https://apps.apple.com/app/id6777826022";
  var PLAY_URL = "https://play.google.com/store/apps/details?id=com.puzzle.hijri.hilal";

  var ua = navigator.userAgent || "";
  var isIOS = /iPad|iPhone|iPod/.test(ua) ||
              (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/.test(ua);

  var ios = document.getElementById("ios");
  var android = document.getElementById("android");
  var androidSoon = document.getElementById("androidSoon");

  if (isIOS) {
    location.replace(APP_STORE_URL);                 // straight to the App Store
  } else if (isAndroid) {
    if (ANDROID_LIVE) {
      android.style.display = "flex"; ios.style.display = "none";
      location.replace(PLAY_URL);
    } else {
      ios.style.display = "none";                    // no false "download" on Android yet
      androidSoon.style.display = "block";
    }
  } else {
    // Desktop / other: show the App Store link (and Play once live).
    if (ANDROID_LIVE) { android.style.display = "flex"; }
    else { androidSoon.style.display = "block"; }
  }
</script>
</body>
</html>
