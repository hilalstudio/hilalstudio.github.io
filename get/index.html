<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Get Hilal — daily Hijri-date puzzle</title>
<meta name="description" content="Hilal — a daily Hijri-date puzzle. Get it for your phone." />
<style>
  :root { --bg:#0F1B2D; --card:#16263d; --gold:#E0B973; --text:#F4ECDD; --dim:#9bb0c9; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; }
  body {
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center; min-height:100vh; padding:32px 24px;
    text-align:center; -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:340px; width:100%; }
  .shot {
    width:180px; height:auto; display:block; margin:0 auto 20px;
    border-radius:18px; border:1px solid rgba(224,185,115,.28);
    box-shadow:0 12px 34px rgba(0,0,0,.45);
  }
  h1 { font-size:22px; letter-spacing:1px; margin:0 0 6px; color:var(--gold); }
  p { color:var(--dim); margin:0 0 24px; line-height:1.5; font-size:15px; }
  .badges { display:flex; flex-direction:column; align-items:center; gap:12px; }
  a.badge {
    display:inline-flex; align-items:center; gap:10px;
    width:220px; height:60px; padding:0 18px;
    background:#000; color:#fff; text-decoration:none; text-align:left;
    border:1px solid rgba(244,236,221,.28); border-radius:12px;
  }
  a.badge svg { width:26px; height:26px; flex:none; fill:#fff; }
  a.badge .lines { display:flex; flex-direction:column; line-height:1.1; }
  a.badge .pre { font-size:11px; letter-spacing:.3px; opacity:.85; }
  a.badge .store { font-size:18px; font-weight:700; letter-spacing:.2px; }
  .soon { color:var(--dim); font-size:13px; margin-top:6px; }
</style>
