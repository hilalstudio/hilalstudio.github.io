<script>
(function () {
  // Analytics must never break the page, so every step swallows its own errors.
  var PAGE = "play", URL = "https://hilal-api.smaverk.com/p", src = "";
  try { src = (new URLSearchParams(location.search).get("src") || "").toLowerCase().replace(/[^a-z0-9-]/g, "").slice(0, 16); } catch (e) {}

  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null;

    if (/apps\.apple\.com/.test(a.href)) window.hilalPing("install_ios");
